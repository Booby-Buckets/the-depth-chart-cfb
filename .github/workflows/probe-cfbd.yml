name: Probe CFBD (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample feeds
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: |
          mkdir out
          B=https://api.collegefootballdata.com
          get() { curl -s -w "\n$1 HTTP %{http_code} %{size_download}B\n" -H "Authorization: Bearer $CFBD_KEY" "$B/$2" -o "out/$1.json" >> out/status.txt; }
          get stats 'stats/player/season?year=2026'
          get ppa 'ppa/players/season?year=2026'
          get usage 'player/usage?year=2026'
          get roster 'roster?year=2026&team=Notre%20Dame'
          get recruits 'recruiting/players?year=2026&classification=HighSchool'
          get portal 'player/portal?year=2026'
          get info 'info'
          cat out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cfbd-probe
          path: out
          retention-days: 1
