name: Rebuild power rankings

# Re-runs scripts/build_hub.py so the ratings, records, "This Week" slate and every team
# page (data/teams/*.json) pick up finished games, then commits public/data/. The push triggers a Vercel deploy, so
# the live site refreshes on its own.
#
# Schedule (UTC, Aug–Jan only):
#   • every morning ~6 AM ET: rolls the slate to the new week
#   • Saturday noon ET → Sunday ~4 AM ET every 20 minutes: finals, records, ratings land as game day plays out
#   • Tuesday–Friday nights (~7 PM – 2 AM ET) every 30 minutes: weeknight games
# Between runs the site also patches W-L records in the browser the moment ESPN marks a game final
# (components/live/useLiveScores.ts → useLiveRecords), so records never wait on this job.
# CFBD_KEY is optional. Add it as a repo secret (Settings → Secrets and variables →
# Actions) and the EPA / success-rate columns switch on; without it the job still runs.

on:
  schedule:
    - cron: '0 10 * 1,8-12 *'            # daily, ~6 AM ET
    - cron: '*/20 16-23 * 1,8-12 6'      # Saturday ~12 PM – 8 PM ET, every 20 min
    - cron: '*/20 0-8 * 1,8-12 0'        # Saturday night into Sunday, to ~4 AM ET
    - cron: '*/30 23 * 1,8-12 2-5'       # Tue–Fri ~7 PM ET
    - cron: '*/30 0-6 * 1,8-12 3-6'      # Tue–Fri nights to ~2 AM ET (UTC Wed–Sat mornings)
  workflow_dispatch: {}                  # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: rebuild-hub
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy pypdf

      # finished weeks and last season never change — keep them between runs
      - uses: actions/cache@v4
        with:
          path: scripts/cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      # sportsbook player prop lines (The Odds API). No-op until the ODDS_API_KEY secret exists;
      # at most one pull per 12 hours, only with games in the next 4 days. Never fails the run.
      - name: Player prop lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_prop_lines.py || echo "prop lines skipped"

      - name: Build ratings
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: python3 scripts/build_hub.py

      # O-line starters by position (LT/LG/C/RG/RT) from school game notes, only for schools whose
      # robots.txt allows it (scripts/ol_notes/census.json). Best effort: never fails the run.
      - name: O-line positions from game notes
        run: timeout 420 python3 scripts/build_ol_notes.py || echo "ol notes skipped"

      - name: Commit if the ratings changed
        run: |
          git add public/data public/sitemap.xml data/plays
          # hub.json's "built" timestamp changes every run; ignore it so an idle day doesn't deploy
          others=$(git diff --cached --name-only | grep -v '^public/data/hub.json$' || true)
          if [ -z "$others" ] && git show HEAD:public/data/hub.json > /tmp/old.json 2>/dev/null && python3 - <<'EOF'
          import json, sys
          a, b = json.load(open('/tmp/old.json')), json.load(open('public/data/hub.json'))
          a.pop('built', None); b.pop('built', None)
          sys.exit(0 if a == b else 1)
          EOF
          then
            echo "No rating, schedule or roster changes."
            exit 0
          fi
          git config user.name "tdc-cfb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: rebuild power rankings + team pages"
          # a code push may have landed while we built: replay our data commit on top of it
          # (our freshly built data wins any conflict), then push; retry once on a race
          for i in 1 2; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
